{% if titles %}
<div class="section-title">群友画像</div>
<div class="title-grid">
    {% for title in titles %}
    <div class="title-card avoid-break">
        <div class="title-avatar">
            {% if title.avatar_data %}
            <img src="{{ title.avatar_data }}" alt="头像">
            {% endif %}
        </div>
        <div style="flex: 1; min-width: 0;">
            <div class="title-name">{{ title.name }}</div>
            <div>
                <span class="title-title">{{ title.title }}</span>
                {% if title.profile_display or title.mbti %}
                <span class="title-mbti">{{ title.profile_display or title.mbti }}</span>
                {% endif %}
            </div>
            <div class="title-reason">{{ title.reason }}</div>
        </div>
    </div>
    {% endfor %}
</div>
{% endif %}
